<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Bookshop</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
    <div class="logo">
        <img src="images/book-icon.png" alt="Bookshop Logo">
        <h1>My Bookshop</h1>
    </div>
    <nav>
        <div class="hamburger" id="hamburger">
            ☰
        </div>
        <ul class="nav-bar" id="nav-links">
            <li class="menu-heading">My Bookshop</li>
            <li><a href="index.html">Home</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Contact Us</a></li>
        </ul>
    </nav>
</header>

<main>
    <section>
<div class="payment-container">
<h2>Payment Options</h2>
    <div class="card-icons">
        <img src="https://img.icons8.com/color/48/mastercard.png" alt="MasterCard" />
        <img src="https://img.icons8.com/color/48/visa.png" alt="Visa" />
        <img src="https://img.icons8.com/color/48/amex.png" alt="Amex" />
    </div>
<form id="paymentForm">
    <label>Card Number</label>
    <input type="text" id="cardNumber" maxlength="16" required />
    <label>Expiration Date</label>
    <div class="row">
        <div>
            <select id="expMonth" required>
                <option value="">Month</option>
                <option value="1">01</option>
                <option value="2">02</option>
                <option value="3">03</option>
                <option value="4">04</option>
                <option value="5">05</option>
                <option value="6">06</option>
                <option value="7">07</option>
                <option value="8">08</option>
                <option value="9">09</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
            </select>
        </div>
        <div>
            <select id="expYear" required>
                <option value="">Year</option>
                <option value="2024">2024</option>
                <option value="2025">2025</option>
                <option value="2026">2026</option>
                <option value="2027">2027</option>
            </select>
        </div>
    </div>

    <label>Security Code</label>
    <input type="text" id="cvv" maxlength="4" required />
    <div class="note">(3–4 digit code normally on the back of your card)</div>

    <button type="submit">Continue</button>
    <div class="error" id="errorMsg"></div>
</form>
</div>

    </section>
</main>


<script src="js/main.js"></script>
<script src="js/pay.js"></script>
</body>
</html>
